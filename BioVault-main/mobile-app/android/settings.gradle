rootProject.name = 'TempApp'
include ':app'

// React Native auto-linking (check multiple locations)
def rnCliPath = file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!rnCliPath.exists()) {
    rnCliPath = file("../node_modules/react-native/node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
if (rnCliPath.exists()) {
    apply from: rnCliPath
    applyNativeModulesSettingsGradle(settings)
}

// React Native Gradle Plugin
def rnGradlePlugin = file("../node_modules/@react-native/gradle-plugin")
if (rnGradlePlugin.exists()) {
    includeBuild(rnGradlePlugin)
}
