# ============================================================================
# Bio-Vault — Nginx Reverse Proxy Configuration
# ============================================================================
# Initially serves HTTP only. After certbot obtains certs, uncomment HTTPS block.
# Initial cert: docker compose exec certbot certbot certonly --webroot \
#               -w /var/www/certbot -d api.biovault.example.com
# ============================================================================

events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;

    # Upstream
    upstream backend {
        server backend:3000;
    }

    # HTTP — redirect to HTTPS (+ certbot challenge)
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS (uncomment after cert obtained)
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Temporarily serve API over HTTP (until TLS is set up)
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket upgrade
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # HTTPS — uncomment after certbot obtains certs
    # server {
    #     listen 443 ssl http2;
    #     server_name api.biovault.example.com;
    #
    #     ssl_certificate /etc/nginx/ssl/live/api.biovault.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/live/api.biovault.example.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers on;
    #
    #     location / {
    #         limit_req zone=api burst=50 nodelay;
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /ws {
    #         proxy_pass http://backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_set_header Host $host;
    #     }
    # }
}
