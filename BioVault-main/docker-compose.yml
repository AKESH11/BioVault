# ============================================================================
# Bio-Vault Protocol — Docker Compose
# ============================================================================
# Usage: docker compose up -d
#
# Services:
#   ipfs     — Kubo IPFS node (content addressing)
#   hardhat  — Local Ethereum node (dev only)
#   backend  — Express.js API server
# ============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # IPFS (Kubo)
  # --------------------------------------------------------------------------
  ipfs:
    image: ipfs/kubo:latest
    container_name: biovault-ipfs
    ports:
      - "4001:4001"    # Swarm
      - "5001:5001"    # API
      - "8080:8080"    # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Hardhat Local Node (dev only — remove for production)
  # --------------------------------------------------------------------------
  hardhat:
    image: node:20-alpine
    container_name: biovault-hardhat
    working_dir: /app
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"
    volumes:
      - ./smart-contracts:/app
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Backend API
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: biovault-backend
    ports:
      - "3000:3000"
    env_file:
      - backend/.env.production
    environment:
      - PORT=3000
      - IPFS_API_URL=http://ipfs:5001
      - POLYGON_RPC_URL=http://hardhat:8545
    depends_on:
      - ipfs
      - hardhat
    volumes:
      - backend_uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  ipfs_data:
  backend_uploads:
