# ============================================================================
# Bio-Vault Protocol — CI/CD Pipeline
# ============================================================================
name: Bio-Vault CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Smart Contract Tests
  # --------------------------------------------------------------------------
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

  # --------------------------------------------------------------------------
  # Job 2: Backend + E2E Tests
  # --------------------------------------------------------------------------
  backend:
    name: Backend & E2E Tests
    runs-on: ubuntu-latest
    services:
      ipfs:
        image: ipfs/kubo:latest
        ports:
          - 5001:5001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install shared + backend deps
      - run: cd shared && npm ci
      - run: cd backend && npm ci
      - run: cd smart-contracts && npm ci

      # Start Hardhat node in background
      - name: Start Hardhat
        run: |
          cd smart-contracts
          npx hardhat node &
          sleep 5
          npx hardhat run scripts/deploy.js --network localhost

      # Start backend
      - name: Start Backend
        run: |
          cd backend
          node src/index.js &
          sleep 3

      # Run E2E tests
      - name: Run E2E Tests
        run: cd backend && npm test
        env:
          IPFS_API_URL: http://127.0.0.1:5001
          POLYGON_RPC_URL: http://127.0.0.1:8545

  # --------------------------------------------------------------------------
  # Job 3: Android APK Build
  # --------------------------------------------------------------------------
  android:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: biovault-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
