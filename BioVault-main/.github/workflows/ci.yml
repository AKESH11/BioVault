# ============================================================================
# Bio-Vault Protocol — CI/CD Pipeline
# ============================================================================
name: Bio-Vault CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Smart Contract Tests
  # --------------------------------------------------------------------------
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

  # --------------------------------------------------------------------------
  # Job 2: Backend + E2E Tests
  # --------------------------------------------------------------------------
  backend:
    name: Backend & E2E Tests
    runs-on: ubuntu-latest
    services:
      ipfs:
        image: ipfs/kubo:latest
        ports:
          - 5001:5001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install shared + backend deps
      - run: cd shared && npm ci
      - run: cd backend && npm ci
      - run: cd smart-contracts && npm ci

      # Start Hardhat node in background
      - name: Start Hardhat
        run: |
          cd smart-contracts
          npx hardhat node &
          sleep 5
          npx hardhat run scripts/deploy.js --network localhost

      # Create .env from deploy output
      - name: Configure backend .env
        run: |
          cd backend
          cp .env.local .env 2>/dev/null || true
          # Override with localhost addresses from deployments.json
          node -e "
            const d = require('../smart-contracts/deployments.json').localhost;
            const lines = [
              'NODE_ENV=test',
              'PORT=3000',
              'POLYGON_RPC_URL=http://127.0.0.1:8545',
              'IPFS_API_URL=http://127.0.0.1:5001',
              'API_KEY=bv-dev-key-2024-change-in-production',
              'JWT_SECRET=ci-test-secret-not-for-production',
              'JWT_REFRESH_SECRET=ci-test-refresh-secret',
              'DEPLOYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80',
              'MEDIA_ANCHOR_CONTRACT=' + d.MediaAnchor,
              'AUTHENTICITY_TOKEN_CONTRACT=' + d.AuthenticityToken,
              'VERIFIER_CONTRACT=' + (d.Verifier || ''),
            ];
            require('fs').writeFileSync('.env', lines.join('\n'));
          "

      # Start backend
      - name: Start Backend
        run: |
          cd backend
          node src/index.js &
          sleep 3

      # Run E2E tests
      - name: Run E2E Tests
        run: cd backend && node test/e2e.test.js

  # --------------------------------------------------------------------------
  # Job 3: Android APK Build
  # --------------------------------------------------------------------------
  android:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build JS Bundle
        run: |
          npx react-native bundle --platform android --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: biovault-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
