# ============================================================================
# Bio-Vault Protocol — Production Docker Compose
# ============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This override:
#   - Removes Hardhat (uses Polygon Amoy/mainnet instead)
#   - Points backend to Amoy RPC
#   - Adds resource limits
#   - Enables log rotation
#   - Adds Nginx reverse proxy with TLS
# ============================================================================

services:
  # Remove Hardhat in production
  hardhat:
    profiles:
      - dev-only       # Never started unless --profile dev-only is passed

  # --------------------------------------------------------------------------
  # IPFS (production settings)
  # --------------------------------------------------------------------------
  ipfs:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Backend API (production settings)
  # --------------------------------------------------------------------------
  backend:
    env_file:
      - backend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - IPFS_API_URL=http://ipfs:5001
      # No POLYGON_RPC_URL override — .env.production points to Amoy/mainnet
    depends_on:
      - ipfs
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy (TLS termination)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: biovault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Certbot (Let's Encrypt auto-renewal)
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: biovault-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    restart: unless-stopped

volumes:
  ipfs_data:
  backend_uploads:
  certbot_data:
